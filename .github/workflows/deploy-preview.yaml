name: Preview Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  files-changed:
    name: Detect Changes
    runs-on: ubuntu-latest
    # Skip if this is a Version Packages commit (production deployment)
    if: contains(github.event.head_commit.message, 'Version Packages') == false
    outputs:
      app: ${{ steps.filter.outputs.app }}
      # Future apps can be added here
      # storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - "apps/app/**"
              - "packages/**"
              - ".github/workflows/deploy-preview.yaml"
              - ".github/workflows/deploy-app.yaml"
              - ".github/composite/**"

  deploy-app:
    name: Deploy App to Preview
    needs: files-changed
    if: needs.files-changed.outputs.app == 'true'
    uses: ./.github/workflows/deploy-app.yaml
    with:
      environment: preview
      ref: ${{ github.sha }}
    secrets: inherit

  output-urls:
    name: Deployment Summary
    needs: [files-changed, deploy-app]
    if: always() && !cancelled() && needs.deploy-app.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Output Deployment URLs
        run: |
          echo "## 🚀 Preview Deployments" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### @repo/app" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **URL:** ${{ needs.deploy-app.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** preview" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
