name: Hotfix Deploy

on:
  workflow_dispatch:
    inputs:
      skip-ci:
        description: "Skip CI checks (use with caution)"
        type: boolean
        required: false
        default: false

jobs:
  validate:
    name: Validate Hotfix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Branch Name
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          if [[ ! "$BRANCH_NAME" =~ ^hotfix/ ]]; then
            echo "❌ Error: Hotfix workflow can only run on 'hotfix/*' branches"
            echo "Current branch: $BRANCH_NAME"
            exit 1
          fi
          echo "✅ Valid hotfix branch: $BRANCH_NAME"

      - name: Setup and Install
        uses: ./.github/composite/pnpm-install

      - name: Check for Changesets
        run: |
          CHANGESET_COUNT=$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l)
          if [ $CHANGESET_COUNT -eq 0 ]; then
            echo "❌ Error: No changesets found"
            echo "Run 'pnpm changeset' to create a changeset describing this hotfix"
            exit 1
          fi
          echo "✅ Found $CHANGESET_COUNT changeset(s)"

  ci:
    name: Run CI
    needs: validate
    if: inputs.skip-ci != true
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ github.ref }}

  version:
    name: Version and Tag
    needs: [validate, ci]
    if: always() && needs.validate.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new-version: ${{ steps.version.outputs.version }}
      tag-name: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup and Install
        uses: ./.github/composite/pnpm-install
        with:
          frozen-lockfile: "false"

      - name: Version Packages
        id: version
        run: |
          # Apply changesets
          pnpm changeset:version
          
          # Get new version from app package.json
          NEW_VERSION=$(node -p "require('./apps/app/package.json').version")
          TAG_NAME="@repo/app@${NEW_VERSION}"
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "📦 New version: $NEW_VERSION"

      - name: Commit and Tag
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          git add .
          git commit -m "[hotfix] version packages - ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.tag }}"
          
          git push origin "$BRANCH_NAME" --tags
          echo "✅ Created tag: ${{ steps.version.outputs.tag }}"

  deploy:
    name: Deploy Hotfix
    needs: version
    uses: ./.github/workflows/deploy-app.yaml
    with:
      environment: production
      ref: ${{ github.ref }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  notify:
    name: Notify Success
    needs: [version, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## 🔥 Hotfix Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.version.outputs.new-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ needs.version.outputs.tag-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${GITHUB_REF#refs/heads/}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment:** ${{ needs.deploy.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
